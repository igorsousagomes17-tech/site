<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bem-vinda ao Igor Sousa Team</title>
<meta name="description" content="Vídeo de 1 minuto mostrando como funciona o app do Igor Sousa Team.">
<meta property="og:title" content="Bem-vinda ao Igor Sousa Team 🧡">
<meta property="og:description" content="Assiste o vídeo de 1 minuto e coloca o app na tela do seu celular.">
<meta property="og:image" content="https://igorsousa.com.br/bemvinda/capa.jpg">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0b0b0c">
<meta name="color-scheme" content="dark">
<link rel="icon" href="../img/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@800&family=Barlow:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#0b0b0c;--panel:#151517;--line:#2a2a2e;--fg:#f4f2ee;--muted:#a8a49c;--accent:#ff6a00;--ink:#1a0d00}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Barlow",Arial,sans-serif;font-size:17px;line-height:1.5}
.wrap{max-width:520px;margin:0 auto;padding:22px 16px 40px}
.logo{font-family:"Barlow Condensed",Impact,sans-serif;font-weight:800;font-size:1.3rem;letter-spacing:.5px}.logo b{color:var(--accent)}
h1{font-family:"Barlow Condensed",Impact,sans-serif;font-weight:800;text-transform:uppercase;font-size:clamp(2.2rem,10vw,3rem);line-height:.95;margin:18px 0 8px}h1 b{color:var(--accent)}
p{margin:0;color:var(--muted)}
video{display:block;width:100%;aspect-ratio:9/16;max-height:78vh;margin:18px auto 0;border-radius:20px;background:#000;border:1px solid var(--line)}
.btn{display:flex;align-items:center;justify-content:center;min-height:56px;margin-top:14px;border-radius:16px;background:var(--accent);color:var(--ink);font-family:"Barlow Condensed",Impact,sans-serif;font-weight:800;font-size:1.3rem;text-transform:uppercase;text-decoration:none;letter-spacing:.5px}
.btn.ghost{background:transparent;color:var(--fg);border:2px solid var(--line)}
.btn:focus-visible{outline:3px solid var(--fg);outline-offset:3px}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">IGOR SOUSA <b>TEAM</b></div>
  <h1>Bem-vinda ao <b>time</b> 🧡</h1>
  <p>Aperta o play: em 1 minuto você vê como o app funciona.</p>
  <video src="boas-vindas.mp4" poster="capa.jpg" controls playsinline preload="metadata"></video>
  <a class="btn" href="../instalar/">Colocar o app na tela</a>
  <a class="btn ghost" href="https://igorsousagomes17-tech.github.io/igor-sousa-team/">Abrir o app</a>
</div>
</body>
</html>
